<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniVet — Sistema de Gestão Veterinária</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde: #1a6b4a;
      --verde-claro: #2d9b6f;
      --verde-bg: #edf7f2;
      --cinza: #f4f4f0;
      --texto: #1a1a1a;
      --texto-fraco: #666;
      --borda: #d8e8df;
      --erro: #c0392b;
      --sucesso: #1a6b4a;
      --branco: #ffffff;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cinza);
      color: var(--texto);
      min-height: 100vh;
    }

    header {
      background: var(--verde);
      color: white;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      letter-spacing: 0.5px;
    }

    header span {
      font-size: 0.8rem;
      opacity: 0.75;
      font-weight: 300;
    }

    nav {
      background: var(--branco);
      border-bottom: 1px solid var(--borda);
      display: flex;
      gap: 0;
      padding: 0 2rem;
      overflow-x: auto;
    }

    nav button {
      background: none;
      border: none;
      padding: 1rem 1.5rem;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--texto-fraco);
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }

    nav button.active, nav button:hover {
      color: var(--verde);
      border-bottom-color: var(--verde);
    }

    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .secao-titulo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      color: var(--verde);
      margin-bottom: 1.5rem;
    }

    .card {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--texto-fraco);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
    }

    input, select {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid var(--borda);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      background: var(--cinza);
      color: var(--texto);
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--verde-claro);
      background: white;
    }

    .btn {
      padding: 0.65rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primario {
      background: var(--verde);
      color: white;
    }

    .btn-primario:hover { background: var(--verde-claro); }

    .btn-secundario {
      background: transparent;
      color: var(--verde);
      border: 1.5px solid var(--verde);
    }

    .btn-secundario:hover { background: var(--verde-bg); }

    .btn-perigo {
      background: transparent;
      color: var(--erro);
      border: 1.5px solid var(--erro);
    }

    .btn-perigo:hover { background: #fdf0ee; }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      color: white;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      z-index: 999;
      max-width: 320px;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.sucesso { background: var(--sucesso); }
    .toast.erro { background: var(--erro); }

    .lista-items { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }

    .item-card {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .item-info { flex: 1; }
    .item-nome { font-weight: 600; font-size: 1rem; }
    .item-detalhe { font-size: 0.82rem; color: var(--texto-fraco); margin-top: 0.2rem; }

    .item-acoes { display: flex; gap: 0.5rem; flex-shrink: 0; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-verde { background: var(--verde-bg); color: var(--verde); }
    .badge-cinza { background: #eee; color: #555; }
    .badge-vermelho { background: #fdf0ee; color: var(--erro); }

    .tab-content { display: none; }
    .tab-content.ativo { display: block; }

    .vazio {
      text-align: center;
      padding: 2rem;
      color: var(--texto-fraco);
      font-style: italic;
    }

    .separador {
      border: none;
      border-top: 1px solid var(--borda);
      margin: 1.25rem 0;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
      .item-card { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <h1>🐾 UniVet</h1>
  <span>Sistema de Gestão Veterinária</span>
</header>

<nav>
  <button class="active" onclick="mostrarAba('tutores')">Tutores</button>
  <button onclick="mostrarAba('pets')">Pets</button>
  <button onclick="mostrarAba('agendamentos')">Agendamentos</button>
</nav>

<main>

  <div id="aba-tutores" class="tab-content ativo">
    <h2 class="secao-titulo">Tutores</h2>

    <div class="card">
      <strong id="form-tutor-titulo">Cadastrar novo tutor</strong>
      <hr class="separador"/>
      <div class="form-grid">
        <div class="full">
          <label>Nome completo</label>
          <input id="t-nome" type="text" placeholder="Ex: João da Silva"/>
        </div>
        <div>
          <label>CPF (11 dígitos)</label>
          <input id="t-cpf" type="text" maxlength="11" placeholder="12345678900"/>
        </div>
        <div>
          <label>Telefone</label>
          <input id="t-telefone" type="text" placeholder="(85) 99999-9999"/>
        </div>
        <div>
          <label>Rua</label>
          <input id="t-rua" type="text" placeholder="Rua das Flores"/>
        </div>
        <div>
          <label>Número</label>
          <input id="t-numero" type="text" placeholder="123"/>
        </div>
        <div>
          <label>Bairro</label>
          <input id="t-bairro" type="text" placeholder="Centro"/>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primario" onclick="salvarTutor()">Salvar</button>
        <button class="btn btn-secundario" onclick="limparFormTutor()">Limpar</button>
      </div>
    </div>

    <div id="lista-tutores" class="lista-items">
      <div class="vazio">Carregando tutores...</div>
    </div>
  </div>

  <div id="aba-pets" class="tab-content">
    <h2 class="secao-titulo">Pets</h2>

    <div class="card">
      <strong id="form-pet-titulo">Cadastrar novo pet</strong>
      <hr class="separador"/>
      <div class="form-grid">
        <div>
          <label>Nome</label>
          <input id="p-nome" type="text" placeholder="Ex: Rex"/>
        </div>
        <div>
          <label>Espécie</label>
          <input id="p-especie" type="text" placeholder="Cão, Gato..."/>
        </div>
        <div>
          <label>Raça</label>
          <input id="p-raca" type="text" placeholder="Labrador"/>
        </div>
        <div>
          <label>Sexo</label>
          <select id="p-sexo">
            <option value="">Selecione</option>
            <option value="Macho">Macho</option>
            <option value="Fêmea">Fêmea</option>
          </select>
        </div>
        <div>
          <label>Idade (anos)</label>
          <input id="p-idade" type="number" min="0" placeholder="3"/>
        </div>
        <div>
          <label>Peso (kg)</label>
          <input id="p-peso" type="number" step="0.1" min="0.1" placeholder="10.5"/>
        </div>
        <div>
          <label>ID do Tutor</label>
          <input id="p-idTutor" type="text" placeholder="Cole o ID do tutor"/>
        </div>
        <div class="full">
          <label>Histórico médico</label>
          <input id="p-historico" type="text" placeholder="Vacinações, cirurgias..."/>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primario" onclick="salvarPet()">Salvar</button>
        <button class="btn btn-secundario" onclick="limparFormPet()">Limpar</button>
      </div>
    </div>

    <div id="lista-pets" class="lista-items">
      <div class="vazio">Carregando pets...</div>
    </div>
  </div>

  <div id="aba-agendamentos" class="tab-content">
    <h2 class="secao-titulo">Agendamentos</h2>

    <div class="card">
      <strong>Novo agendamento</strong>
      <hr class="separador"/>
      <div class="form-grid">
        <div>
          <label>ID do Cliente</label>
          <input id="a-clienteId" type="number" placeholder="Ex: 1"/>
        </div>
        <div>
          <label>ID do Animal</label>
          <input id="a-animalId" type="number" placeholder="Ex: 1"/>
        </div>
        <div class="full">
          <label>Data e hora do agendamento</label>
          <input id="a-data" type="datetime-local"/>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primario" onclick="criarAgendamento()">Agendar</button>
        <button class="btn btn-secundario" onclick="limparFormAgendamento()">Limpar</button>
      </div>
    </div>

    <div id="lista-agendamentos" class="lista-items">
      <div class="vazio">Carregando agendamentos...</div>
    </div>
  </div>

</main>

<div id="toast" class="toast"></div>

<script>
  const API = {
    tutores:      'http://localhost:8080/tutores',
    pets:         'http://localhost:8081/pets',
    agendamentos: 'http://localhost:8082/agendamentos'
  };

  let editandoTutorId = null;
  let editandoPetId = null;

  function mostrarAba(nome) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('ativo'));
    document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
    document.getElementById('aba-' + nome).classList.add('ativo');
    event.target.classList.add('active');

    if (nome === 'tutores') carregarTutores();
    if (nome === 'pets') carregarPets();
    if (nome === 'agendamentos') carregarAgendamentos();
  }

  function toast(msg, tipo = 'sucesso') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${tipo} show`;
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  async function req(url, method = 'GET', body = null) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err || `Erro ${res.status}`);
    }
    if (res.status === 204 || method === 'DELETE') return null;
    return res.json();
  }

  async function carregarTutores() {
    const lista = document.getElementById('lista-tutores');
    try {
      const tutores = await req(API.tutores);
      if (!tutores.length) { lista.innerHTML = '<div class="vazio">Nenhum tutor cadastrado.</div>'; return; }
      lista.innerHTML = tutores.map(t => `
        <div class="item-card">
          <div class="item-info">
            <div class="item-nome">${t.nomeCompletoTutor}</div>
            <div class="item-detalhe">CPF: ${t.cpf} &nbsp;|&nbsp; Tel: ${t.telefone}</div>
            <div class="item-detalhe">${t.rua}, ${t.numero} — ${t.bairro}</div>
            <div class="item-detalhe" style="font-size:0.72rem;color:#aaa;margin-top:4px">ID: ${t.id}</div>
          </div>
          <div class="item-acoes">
            <button class="btn btn-secundario" onclick="editarTutor('${t.id}')">Editar</button>
            <button class="btn btn-perigo" onclick="deletarTutor('${t.id}')">Excluir</button>
          </div>
        </div>
      `).join('');
    } catch(e) {
      lista.innerHTML = `<div class="vazio">Erro ao conectar ao serviço de tutores.<br><small>${e.message}</small></div>`;
    }
  }

  async function salvarTutor() {
    const tutor = {
      nomeCompletoTutor: document.getElementById('t-nome').value.trim(),
      cpf:       document.getElementById('t-cpf').value.trim(),
      telefone:  document.getElementById('t-telefone').value.trim(),
      rua:       document.getElementById('t-rua').value.trim(),
      numero:    document.getElementById('t-numero').value.trim(),
      bairro:    document.getElementById('t-bairro').value.trim()
    };
    try {
      if (editandoTutorId) {
        await req(`${API.tutores}/${editandoTutorId}`, 'PUT', tutor);
        toast('Tutor atualizado com sucesso!');
      } else {
        await req(API.tutores, 'POST', tutor);
        toast('Tutor cadastrado com sucesso!');
      }
      limparFormTutor();
      carregarTutores();
    } catch(e) {
      toast(e.message, 'erro');
    }
  }

  async function editarTutor(id) {
    try {
      const t = await req(`${API.tutores}/${id}`);
      document.getElementById('t-nome').value     = t.nomeCompletoTutor;
      document.getElementById('t-cpf').value      = t.cpf;
      document.getElementById('t-telefone').value = t.telefone;
      document.getElementById('t-rua').value      = t.rua;
      document.getElementById('t-numero').value   = t.numero;
      document.getElementById('t-bairro').value   = t.bairro;
      editandoTutorId = id;
      document.getElementById('form-tutor-titulo').textContent = 'Editando tutor';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch(e) { toast(e.message, 'erro'); }
  }

  async function deletarTutor(id) {
    if (!confirm('Deseja excluir este tutor?')) return;
    try {
      await req(`${API.tutores}/${id}`, 'DELETE');
      toast('Tutor excluído.');
      carregarTutores();
    } catch(e) { toast(e.message, 'erro'); }
  }

  function limparFormTutor() {
    ['t-nome','t-cpf','t-telefone','t-rua','t-numero','t-bairro'].forEach(id => document.getElementById(id).value = '');
    editandoTutorId = null;
    document.getElementById('form-tutor-titulo').textContent = 'Cadastrar novo tutor';
  }

  async function carregarPets() {
    const lista = document.getElementById('lista-pets');
    try {
      const pets = await req(API.pets);
      if (!pets.length) { lista.innerHTML = '<div class="vazio">Nenhum pet cadastrado.</div>'; return; }
      lista.innerHTML = pets.map(p => `
        <div class="item-card">
          <div class="item-info">
            <div class="item-nome">${p.nome} <span class="badge badge-verde">${p.especie}</span></div>
            <div class="item-detalhe">${p.raca || '—'} &nbsp;|&nbsp; ${p.sexo || '—'} &nbsp;|&nbsp; ${p.idade != null ? p.idade + ' anos' : '—'} &nbsp;|&nbsp; ${p.peso != null ? p.peso + ' kg' : '—'}</div>
            <div class="item-detalhe">Tutor ID: ${p.idTutor || '—'}</div>
            <div class="item-detalhe" style="font-size:0.72rem;color:#aaa;margin-top:4px">ID: ${p.id}</div>
          </div>
          <div class="item-acoes">
            <button class="btn btn-secundario" onclick="editarPet('${p.id}')">Editar</button>
            <button class="btn btn-perigo" onclick="deletarPet('${p.id}')">Excluir</button>
          </div>
        </div>
      `).join('');
    } catch(e) {
      lista.innerHTML = `<div class="vazio">Erro ao conectar ao serviço de pets.<br><small>${e.message}</small></div>`;
    }
  }

  async function salvarPet() {
    const pet = {
      nome:           document.getElementById('p-nome').value.trim(),
      especie:        document.getElementById('p-especie').value.trim(),
      raca:           document.getElementById('p-raca').value.trim(),
      sexo:           document.getElementById('p-sexo').value,
      idade:          parseInt(document.getElementById('p-idade').value) || null,
      peso:           parseFloat(document.getElementById('p-peso').value) || null,
      idTutor:        document.getElementById('p-idTutor').value.trim(),
      historicoMedico:document.getElementById('p-historico').value.trim()
    };
    try {
      if (editandoPetId) {
        await req(`${API.pets}/${editandoPetId}`, 'PUT', pet);
        toast('Pet atualizado com sucesso!');
      } else {
        await req(API.pets, 'POST', pet);
        toast('Pet cadastrado com sucesso!');
      }
      limparFormPet();
      carregarPets();
    } catch(e) { toast(e.message, 'erro'); }
  }

  async function editarPet(id) {
    try {
      const p = await req(`${API.pets}/${id}`);
      document.getElementById('p-nome').value     = p.nome;
      document.getElementById('p-especie').value  = p.especie;
      document.getElementById('p-raca').value     = p.raca || '';
      document.getElementById('p-sexo').value     = p.sexo || '';
      document.getElementById('p-idade').value    = p.idade ?? '';
      document.getElementById('p-peso').value     = p.peso ?? '';
      document.getElementById('p-idTutor').value  = p.idTutor || '';
      document.getElementById('p-historico').value= p.historicoMedico || '';
      editandoPetId = id;
      document.getElementById('form-pet-titulo').textContent = 'Editando pet';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch(e) { toast(e.message, 'erro'); }
  }

  async function deletarPet(id) {
    if (!confirm('Deseja excluir este pet?')) return;
    try {
      await req(`${API.pets}/${id}`, 'DELETE');
      toast('Pet excluído.');
      carregarPets();
    } catch(e) { toast(e.message, 'erro'); }
  }

  function limparFormPet() {
    ['p-nome','p-especie','p-raca','p-idade','p-peso','p-idTutor','p-historico'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('p-sexo').value = '';
    editandoPetId = null;
    document.getElementById('form-pet-titulo').textContent = 'Cadastrar novo pet';
  }

  const STATUS_BADGE = {
    AGENDADO:  'badge-verde',
    REALIZADO: 'badge-cinza',
    CANCELADO: 'badge-vermelho'
  };

  async function carregarAgendamentos() {
    const lista = document.getElementById('lista-agendamentos');
    try {
      const ags = await req(API.agendamentos);
      if (!ags.length) { lista.innerHTML = '<div class="vazio">Nenhum agendamento cadastrado.</div>'; return; }
      lista.innerHTML = ags.map(a => {
        const data = a.dataAgendamento ? new Date(a.dataAgendamento).toLocaleString('pt-BR') : '—';
        const badge = STATUS_BADGE[a.status] || 'badge-cinza';
        return `
          <div class="item-card">
            <div class="item-info">
              <div class="item-nome">
                Agendamento
                <span class="badge ${badge}">${a.status}</span>
                ${a.confirmado ? '<span class="badge badge-verde">✓ Confirmado</span>' : ''}
              </div>
              <div class="item-detalhe">Cliente ID: ${a.clienteId} &nbsp;|&nbsp; Animal ID: ${a.animalId}</div>
              <div class="item-detalhe">Data: ${data}</div>
              <div class="item-detalhe" style="font-size:0.72rem;color:#aaa;margin-top:4px">ID: ${a.agendamentoId}</div>
            </div>
            <div class="item-acoes" style="flex-direction:column">
              ${a.status === 'AGENDADO' ? `
                <button class="btn btn-secundario" style="font-size:0.8rem;padding:0.4rem 0.8rem" onclick="confirmarAgendamento('${a.agendamentoId}')">Confirmar</button>
                <button class="btn btn-perigo" style="font-size:0.8rem;padding:0.4rem 0.8rem;margin-top:4px" onclick="cancelarAgendamento('${a.agendamentoId}')">Cancelar</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    } catch(e) {
      lista.innerHTML = `<div class="vazio">Erro ao conectar ao serviço de agendamentos.<br><small>${e.message}</small></div>`;
    }
  }

  async function criarAgendamento() {
    const dataVal = document.getElementById('a-data').value;
    const ag = {
      clienteId:       parseInt(document.getElementById('a-clienteId').value),
      animalId:        parseInt(document.getElementById('a-animalId').value),
      dataAgendamento: dataVal ? new Date(dataVal).toISOString().slice(0,19) : null
    };
    try {
      await req(API.agendamentos, 'POST', ag);
      toast('Agendamento criado com sucesso!');
      limparFormAgendamento();
      carregarAgendamentos();
    } catch(e) { toast(e.message, 'erro'); }
  }

  async function confirmarAgendamento(id) {
    try {
      await req(`${API.agendamentos}/${id}/confirmar`, 'PATCH');
      toast('Agendamento confirmado!');
      carregarAgendamentos();
    } catch(e) { toast(e.message, 'erro'); }
  }

  async function cancelarAgendamento(id) {
    if (!confirm('Cancelar este agendamento?')) return;
    try {
      await req(`${API.agendamentos}/${id}/cancelar-manual`, 'PATCH');
      toast('Agendamento cancelado.');
      carregarAgendamentos();
    } catch(e) { toast(e.message, 'erro'); }
  }

  function limparFormAgendamento() {
    document.getElementById('a-clienteId').value = '';
    document.getElementById('a-animalId').value = '';
    document.getElementById('a-data').value = '';
  }

  carregarTutores();
</script>
</body>
</html>
